<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spirit wear · A little more breathing room</title>
<link rel="icon" href="assets/fireside-logo.png"><link rel="stylesheet" href="spirit-wear-compact.css">
</head>
<body>
<header class="explorer">
  <div class="intro"><div><h1>A little more breathing room</h1><p>Shorter spirit wear layouts, shown in the homepage with more space between events.</p></div><a href="index.html#home">Back to the site</a></div>
  <div class="options" role="group" aria-label="Spirit wear layout">
    <button data-look="current" aria-pressed="false">Current</button>
    <button data-look="editorial" aria-pressed="true">01 · Compact editorial</button>
    <button data-look="ribbon" aria-pressed="false">02 · Light ribbon</button>
    <button data-look="feature" aria-pressed="false">03 · One favorite</button>
    <button data-look="shelf" aria-pressed="false">04 · Quiet shelf</button>
  </div>
  <div class="context"><p id="look-note" aria-live="polite"></p><div class="options sizes" role="group" aria-label="Preview width"><button data-size="desktop" aria-pressed="true">Desktop</button><button data-size="mobile" aria-pressed="false">Mobile</button></div></div>
</header>
<main class="preview"><iframe title="Fireside homepage layout preview" id="homepage"></iframe></main>
<script src="spirit-wear-compact.js"></script>
</body>
</html>
